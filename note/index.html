<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<title>Note</title>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<!-- <meta http-equiv='refresh' content='0; url="https://apps.apple.com/app/id1602765272"'> -->
<meta name='apple-itunes-app' content='app-id=1602765272'>
<link rel='icon' type='image/png' href='/note/favicon-16x16.png' sizes='16x16'>
<link rel='icon' type='image/png' href='/note/favicon-32x32.png' sizes='32x32'>
<link rel='icon' type='image/png' href='/note/favicon-48x48.png' sizes='48x48'>
<link rel='icon' type='image/png' href='/note/favicon-180x180.png' sizes='180x180'>
<link rel='icon' type='image/png' href='/note/favicon-192x192.png' sizes='192x192'>
<link rel='icon' type='image/png' href='/note/favicon-512x512.png' sizes='512x512'>
<style>
html {
  background-color: white
}
@media (prefers-color-scheme: dark) {
  html {
    background-color: black
  }
}
body {
  image-rendering: optimizeQuality;
  margin: 0 auto
}
main {
  margin: 20px auto
}
.iPhone {
  background: url('/note/iPhoneNote.webp') no-repeat;
  background-size: 293px 599px;
  display: block;
  height: 599px;
  margin: 0 auto;
  width: 293px
}
@media only screen and (orientation: portrait) and (min-width: 438px), only screen and (orientation: landscape) and (min-width: 768px) {
  html, body {
    height: 100%
  }
  body {
    display: grid;
    place-items: center center
  }
  main {
    margin: 0 auto
  }
}
</style>
</head>
<body>
  <main>
    <a href='https://apps.apple.com/nl/app/note/id1602765272?ppid=8855d978-fb1e-4d20-b179-36038337c91d' title='Download Note on the App Store'>
      <div class='iPhone' alt='iPhone showing our app Note.'></div>
    </a>
  </main>
  <script>
    const isMobileSafari = navigator.userAgent.match(/safari/i) && navigator.vendor.match(/apple/i) && navigator.maxTouchPoints > 0;    
    if (!isMobileSafari) {
      document.querySelector('a').addEventListener('click', function(event) {
        event.preventDefault();
        setTimeout(() => window.location.assign(this.getAttribute('href')), 1000)
      });
    }
  </script>
</body>
</html>
